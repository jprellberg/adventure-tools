name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build
        run: dx build --release --platform web --debug-symbols=false

      # GitHub Pages serves 404.html for unknown paths; the app shell lets the
      # client-side router handle deep links.
      - name: Add SPA fallback
        run: cp target/dx/adventure-tools/release/web/public/index.html target/dx/adventure-tools/release/web/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/adventure-tools/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
